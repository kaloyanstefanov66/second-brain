[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.2"
description = "A local-first second brain: finds your notes, PDFs and bookmarks, organizes them by topic, and answers questions with citations, all on your machine."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["second-brain", "knowledge-graph", "personal-knowledge-management", "pkm", "note-taking",
            "semantic-search", "local-first", "rag", "embeddings", "obsidian", "markdown", "bookmarks", "desktop-app"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/kaloyanstefanov66/second-brain"
Download = "https://github.com/kaloyanstefanov66/second-brain/releases/latest"
Issues = "https://github.com/kaloyanstefanov66/second-brain/issues"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "watchdog>=4.0",
    "anthropic>=2.1",  # Claude as an optional cloud answer engine (used only with a key)
]

[project.optional-dependencies]
# Local neural embeddings (ONNX, CPU). Downloads a ~70MB model once, then runs offline.
embeddings = ["fastembed>=0.3"]
# Native app window (macOS: WebKit, Windows: Edge WebView2, Linux: GTK or Qt if installed)
desktop = ["pywebview>=5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
brain = "secondbrain.cli:main"

[project.gui-scripts]
second-brain = "secondbrain.desktop:main"

[tool.setuptools.packages.find]
include = ["secondbrain*"]

[tool.setuptools.package-data]
secondbrain = ["static/*"]
