[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-os"
version = "0.1.0"
description = "Local-first knowledge graph and search for your notes, PDFs, bookmarks and documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "watchdog>=4.0",
]

[project.optional-dependencies]
# Local neural embeddings (ONNX, CPU). Downloads a ~70MB model once, then runs offline.
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
brain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
include = ["secondbrain*"]

[tool.setuptools.package-data]
secondbrain = ["static/*"]
